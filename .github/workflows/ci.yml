name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CW_TEST_GPU: software # Mesa llvmpipe (GL) and lavapipe (WebGPU)
  CW_RENDER_SCALE: 1 # the games' own 960x540 instead of 1080p: software rendering is slow
  CW_RUN_TIMEOUT_MS: 3600000 # one native run

jobs:
  carts:
    name: Carts
    runs-on: ubuntu-latest
    permissions:
      contents: write # a v* tag publishes the carts as a GitHub release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libsdl2-dev libegl-dev libgles-dev
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/deps.lock', 'scripts/fetch-deps.sh') }}
      - name: Fetch dependencies
        run: scripts/fetch-deps.sh
      - name: Build cwpack (packs the carts' assets)
        run: TARGETS=native scripts/build.sh cwpack
      - name: Build GL and dual GL + WebGPU carts
        run: TARGETS="cart cart-wgpu" scripts/build.sh bikemesa bomberdude derby pugball spout
      - name: Collect carts
        run: |
          mkdir -p carts
          for g in bikemesa bomberdude derby pugball spout; do
            cp build/cart-wgpu/carts/$g.wasc carts/$g.wasc
            cp build/cart/carts/$g.wasc carts/$g-gl.wasc
          done
          ls -l carts
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: carts-${{ env.SHORT_SHA }}
          path: carts/*.wasc
          retention-days: 30
          if-no-files-found: error
      - name: Release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" carts/*.wasc --title "$GITHUB_REF_NAME" --generate-notes

  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libsdl2-dev \
            libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/deps.lock', 'scripts/fetch-deps.sh') }}
      - name: Fetch dependencies
        run: scripts/fetch-deps.sh
      - name: Build native
        run: TARGETS=native scripts/build.sh
      # Each game's _auto gate: a scripted full session, checked on GL and on WebGPU.
      # The full gate set runs locally with tests/gate.mjs.
      - name: Gates on GL (native, software rendering)
        run: node tests/gate.mjs bikemesa-auto bomberdude-auto derby-auto pugball-auto spout-auto --hosts native
      - name: Gates on WebGPU (native, software rendering)
        run: node tests/gate.mjs bikemesa-auto bomberdude-auto derby-auto pugball-auto spout-auto --hosts native --gpu webgpu
