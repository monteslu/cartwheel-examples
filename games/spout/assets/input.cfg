# spout controls (cartwheel/input.h binding text). Screen directions: up climbs,
# left / right walk round the spout. Touch: a floating stick plus JUMP / BRACE
# (main.c binds them to these actions).
left = key:left, key:a, pad:left, axis:lx-
right = key:right, key:d, pad:right, axis:lx+
up = key:up, key:w, pad:up, axis:ly-
down = key:down, key:s, pad:down, axis:ly+
jump = key:space, pad:south
brace = key:lshift, key:rshift, pad:east, axis:lt+, axis:rt+
silk = key:e, pad:west
start = key:return, pad:start
back = key:escape, key:backspace, pad:back
pause = key:p, key:escape, pad:start
