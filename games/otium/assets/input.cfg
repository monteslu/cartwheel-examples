# otium controls (cartwheel/input.h binding text). The stick or d-pad hops
# the cursor between cities and picks on the order wheel; A opens the wheel
# and gives the order; B goes back; RT (or Tab) lets time run while held;
# LB / RB choose which cart a move sends. The mouse works everything too.
left = key:a, key:left, pad:left, axis:lx-
right = key:d, key:right, pad:right, axis:lx+
up = key:w, key:up, pad:up, axis:ly-
down = key:s, key:down, pad:down, axis:ly+
ok = key:space, key:return, pad:south
back = key:escape, key:backspace, pad:east
wait = key:tab, key:lshift, axis:rt+@0.3, pad:north
prev = key:q, pad:lshoulder
next = key:e, pad:rshoulder
pause = key:p, pad:start
zoom_in = key:equals, axis:ry-
zoom_out = key:minus, axis:ry+
ledger = key:i, pad:back
