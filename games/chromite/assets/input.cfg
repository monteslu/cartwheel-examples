# chromite controls (cartwheel/input.h binding text). Up is up the screen.
# Touch: a floating stick plus FIRE / BOMB (main.c binds them to these actions).
left = key:left, key:a, pad:left, axis:lx-
right = key:right, key:d, pad:right, axis:lx+
up = key:up, key:w, pad:up, axis:ly-
down = key:down, key:s, pad:down, axis:ly+
fire = key:space, key:j, key:lctrl, pad:south, axis:rt+
item = key:k, key:x, pad:east, pad:west
start = key:return, pad:start
back = key:backspace, pad:back
pause = key:escape, key:p, pad:start
