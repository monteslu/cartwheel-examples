# bomberdude controls (cartwheel/input.h binding text). Players 1-4 are pads
# 1-4 (stick or d-pad, A bomb, B / X action, START pause). Player 1 also has
# the keyboard: WASD or the arrows to move, Space / Z / Enter to drop a bomb,
# X / E / Shift for the action (set off a remote bomb, stop a kicked one).
# When a second keyboard player has joined on the players screen, the arrows,
# Enter and Right Shift are theirs instead (main.c). The mouse works the menus.
left = key:a, pad:left, axis:lx-
right = key:d, pad:right, axis:lx+
up = key:w, pad:up, axis:ly-
down = key:s, pad:down, axis:ly+
bomb = key:space, key:z, pad:south
act = key:x, key:e, key:lshift, pad:east, pad:west
start = key:return, pad:start
cancel = key:escape, key:backspace, pad:east, pad:back
pause = key:escape, key:p, pad:start
pick = key:x, key:e, key:c, pad:west, pad:north
k2_left = key:left
k2_right = key:right
k2_up = key:up
k2_down = key:down
k2_bomb = key:return, key:rctrl
k2_act = key:rshift
