# pugball controls (cartwheel/input.h binding text). Player 1 is pad 1 plus
# the keyboard and mouse; players 2-4 are pads 2-4. On the pitch W / S are
# throttle and, in the air, pitch, as the stick is. The menus also take the
# mouse (read raw in main.c; touch_pointer makes the first finger the mouse,
# so the mouse buttons do nothing on the pitch: the steering thumb would boost).
thr_fwd = axis:rt+, pad:rshoulder, key:w, key:up
thr_back = axis:lt+, key:s, key:down
steer_l = axis:lx-, key:a, key:left, pad:left
steer_r = axis:lx+, key:d, key:right, pad:right
pitch_fwd = axis:ly-, key:w, key:up, pad:up
pitch_back = axis:ly+, key:s, key:down, pad:down
jump = pad:south, key:space
boost = pad:east, key:lshift, key:rshift
slide = pad:west, pad:lshoulder, key:lctrl, key:q
ballcam = pad:north, key:c
start = pad:start, key:return
back = pad:back, key:escape, key:backspace
m_left = pad:left, axis:lx-@0.6, key:a, key:left
m_right = pad:right, axis:lx+@0.6, key:d, key:right
m_up = pad:up, axis:ly-@0.6, key:w, key:up
m_down = pad:down, axis:ly+@0.6, key:s, key:down
m_ok = pad:south, key:space, key:return
m_alt = pad:west, key:e
# the team sheet: a player's pug changes side (pads 2-4 also with left / right),
# and pads 2-4 leave with (B)
m_team = pad:lshoulder, pad:rshoulder, key:t
m_leave = pad:east
