# racer controls (cartwheel/input.h binding text). Player 1 is pad 1 plus the keyboard;
# players 2-4 are pads 2-4. The menus also take the mouse and taps.
thr_fwd = axis:rt+, pad:south, key:w, key:up
thr_back = axis:lt+, pad:east, key:s, key:down
steer_l = axis:lx-, key:a, key:left, pad:left
steer_r = axis:lx+, key:d, key:right, pad:right
pitch_up = axis:ly-@0.35, key:r
pitch_dn = axis:ly+@0.35, key:f
drift = pad:rshoulder, pad:lshoulder, key:lshift, key:rshift
item = pad:west, key:e, key:lctrl
trick = pad:north, key:q
look = pad:rstick, key:c
reset = pad:back, key:backspace
start = pad:start, key:escape, key:p
back = pad:back, pad:east, key:escape, key:backspace
m_left = pad:left, axis:lx-@0.6, key:a, key:left
m_right = pad:right, axis:lx+@0.6, key:d, key:right
m_up = pad:up, axis:ly-@0.6, key:w, key:up
m_down = pad:down, axis:ly+@0.6, key:s, key:down
m_ok = pad:south, key:space, key:return
