# BikeMesa controls (cartwheel/input.h binding text). Nothing needs a
# trigger or a shoulder button: a d-pad, four face buttons, Start and Back
# reach everything, and the d-pad and the left stick are interchangeable
# (the stick proportional, the d-pad full). The game's prompts draw these
# bindings with the engine's glyphs (cartwheel/prompt.h), so a change here
# shows in every prompt.
#   Gamepad: south pedals (the right trigger too, analog), east brakes and,
#   stopped, back-pedals (the left trigger too), west hops, left / right lean
#   back / forward (on the ground: wheelies and manuals; in the air: flips),
#   hold north + a direction for a pose in the air (left no-hands, right
#   no-feet, up superman; the left, right and both shoulders do the same),
#   Back returns to the checkpoint, Start pauses (and on the finish screen
#   rides again). Up / down are kept for lanes. North opens the graphics
#   settings from the pause screen.
#   Keyboard: Z pedal, X brake, C hop, Left / Right lean, A / S / D poses,
#   R checkpoint (and on the finish screen rides again), Esc pause, G the
#   graphics settings.
# The on-screen touch controls bind to these actions in main.c (touch:<id>);
# the mouse and taps (cw_app_desc.touch_pointer) work the menus.
pedal = pad:south, axis:rt+, key:z
brake = pad:east, axis:lt+, key:x
hop = pad:west, key:c
lean_back = pad:left, axis:lx-, key:left
lean_fwd = pad:right, axis:lx+, key:right
dir_up = pad:up, axis:ly-@0.5, key:up
dir_down = pad:down, axis:ly+@0.5, key:down
pose = pad:north
pose_hands = pad:lshoulder, key:a
pose_feet = pad:rshoulder, key:s
pose_superman = key:d
reset = pad:back, key:r
pause = pad:start, key:escape, key:p
m_left = pad:left, axis:lx-@0.6, key:left
m_right = pad:right, axis:lx+@0.6, key:right
m_up = pad:up, axis:ly-@0.6, key:up
m_down = pad:down, axis:ly+@0.6, key:down
m_ok = pad:south, key:space, key:return, key:z
m_back = pad:east, pad:back, key:escape, key:backspace
retry = pad:start, key:r
settings = pad:north, key:g
