# derby controls (cartwheel/input.h binding text). Player 1 is pad 1 plus
# the keyboard; players 2-4 are pads 2-4. RT may not reach a cart through
# every host's pad, so R1 also throttles and L1 brakes. The menus also take
# the mouse and taps (touch_pointer makes the first finger the mouse).
# Enter is a confirm (m_ok), never START: in the pause menu it picks the item
# under the cursor instead of resuming.
thr_fwd = axis:rt+, pad:rshoulder, key:w, key:up
thr_back = axis:lt+, pad:lshoulder, key:s, key:down
steer_l = axis:lx-, key:a, key:left, pad:left
steer_r = axis:lx+, key:d, key:right, pad:right
handbrake = pad:south, key:space
horn = pad:east, key:h
look = pad:north, key:c
start = pad:start, key:escape, key:p
back = pad:back, pad:east, key:escape, key:backspace
m_left = pad:left, axis:lx-@0.6, key:a, key:left
m_right = pad:right, axis:lx+@0.6, key:d, key:right
m_up = pad:up, axis:ly-@0.6, key:w, key:up
m_down = pad:down, axis:ly+@0.6, key:s, key:down
m_ok = pad:south, key:space, key:return
